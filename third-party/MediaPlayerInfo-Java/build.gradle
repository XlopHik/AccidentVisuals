plugins {
    id 'java-library'
}

group = 'com.mediaplayerinfo'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes(
                'Implementation-Title': 'MediaPlayerInfo',
                'Implementation-Version': project.version
        )
    }
}